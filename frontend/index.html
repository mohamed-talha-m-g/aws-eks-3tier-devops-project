<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #1f2933; }
    h1 { margin-bottom: 4px; }
    .meta { color: #616e7c; font-size: 13px; margin-bottom: 24px; }
    form { display: flex; gap: 8px; margin-bottom: 16px; }
    input { flex: 1; padding: 10px; border: 1px solid #cbd2d9; border-radius: 6px; font-size: 15px; }
    button { padding: 10px 14px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: 10px; padding: 10px; border-bottom: 1px solid #e4e7eb; }
    li.done span { text-decoration: line-through; color: #9aa5b1; }
    li span { flex: 1; cursor: pointer; }
    li button { background: #e12d39; padding: 4px 10px; }
  </style>
</head>
<body>
  <h1>TaskFlow</h1>
  <div class="meta" id="meta">Connecting to API...</div>

  <form id="form">
    <input id="title" placeholder="What needs to be done?" maxlength="200" required>
    <button type="submit">Add</button>
  </form>
  <ul id="list"></ul>

  <script>
    // All calls go to /api/... on the same host. Nginx (or the Ingress)
    // forwards them to the API service, so the browser never needs the API's address.
    const list = document.getElementById("list");

    async function loadInfo() {
      const r = await fetch("/api/info");
      const i = await r.json();
      document.getElementById("meta").textContent =
        `API version ${i.version} - served by ${i.hostname}`;
    }

    async function loadTasks() {
      const tasks = await (await fetch("/api/tasks")).json();
      list.innerHTML = "";
      for (const t of tasks) {
        const li = document.createElement("li");
        if (t.done) li.className = "done";
        const span = document.createElement("span");
        span.textContent = t.title;           // textContent avoids HTML injection
        span.onclick = () => fetch(`/api/tasks/${t.id}`, { method: "PATCH" }).then(refresh);
        const del = document.createElement("button");
        del.textContent = "Delete";
        del.onclick = () => fetch(`/api/tasks/${t.id}`, { method: "DELETE" }).then(refresh);
        li.append(span, del);
        list.append(li);
      }
    }

    function refresh() { loadInfo(); loadTasks(); }

    document.getElementById("form").onsubmit = async (e) => {
      e.preventDefault();
      const input = document.getElementById("title");
      await fetch("/api/tasks", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title: input.value }),
      });
      input.value = "";
      refresh();
    };

    refresh();
  </script>
</body>
</html>
